
name: Update Greek and Albanian EPG

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Greece EPG
        run: |
          curl -fL --retry 3 \
            "https://www.open-epg.com/files/greece.xml" \
            -o greece.xml.tmp

      - name: Download Albania EPG
        run: |
          curl -fL --retry 3 \
            "https://www.open-epg.com/files/albania.xml" \
            -o albania.xml.tmp

      - name: Validate XML files
        run: |
          python -c "import xml.etree.ElementTree as ET; [ET.parse(f) for f in ['greece.xml.tmp','albania.xml.tmp']]"
          mv greece.xml.tmp greece.xml
          mv albania.xml.tmp albania.xml

      - name: Publish updated EPG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greece.xml albania.xml
          if git diff --cached --quiet; then
            echo "No EPG changes"
            exit 0
          fi
          git commit -m "Update Greece and Albania EPG"
          git push


name: Update Greek EPG

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Open-EPG Greece
        run: |
          curl -fL --retry 3 \
            "https://www.open-epg.com/files/greece.xml" \
            -o greece.xml.tmp

      - name: Validate XML
        run: |
          python -c "import xml.etree.ElementTree as ET; r=ET.parse('greece.xml.tmp').getroot(); assert r.tag == 'tv', 'Invalid XMLTV root'"
          mv greece.xml.tmp greece.xml

      - name: Publish updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greece.xml
          if git diff --cached --quiet; then
            echo "EPG has not changed"
            exit 0
          fi
          git commit -m "Update Greek EPG"
          git push

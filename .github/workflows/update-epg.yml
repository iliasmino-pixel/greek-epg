
name: Update Combined EPG

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Greece
        run: |
          curl -fL --retry 3 \
            https://www.open-epg.com/files/greece.xml \
            -o greece.xml

      - name: Download Albania
        run: |
          curl -fL --retry 3 \
            https://www.open-epg.com/files/albania.xml \
            -o albania.xml

      - name: Merge EPG files
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          merged = ET.Element("tv")
          seen_channels = set()

          for filename in ("greece.xml", "albania.xml"):
              root = ET.parse(filename).getroot()

              for element in root:
                  if element.tag == "channel":
                      channel_id = element.get("id")
                      if channel_id in seen_channels:
                          continue
                      seen_channels.add(channel_id)

                  if element.tag in ("channel", "programme"):
                      merged.append(element)

          ET.indent(merged, space="  ")
          ET.ElementTree(merged).write(
              "combined.xml",
              encoding="UTF-8",
              xml_declaration=True
          )
          PY

      - name: Validate combined EPG
        run: |
          python -c "import xml.etree.ElementTree as ET; r=ET.parse('combined.xml').getroot(); assert r.tag == 'tv'; assert len(r.findall('programme')) > 0"

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greece.xml albania.xml combined.xml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update combined Greek and Albanian EPG"
          git push
